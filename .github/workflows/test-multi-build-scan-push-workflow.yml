name: "[Build - Docker] Build, Scan and Push Image"

on:
  workflow_call:
    inputs:
      # Docker image info used by build, scan, push, and cache references.
      image_name:
        type: string
        description: "ECR image name"
        required: true

      image_tag:
        type: string
        description: "Tag for docker image"
        default: "latest"
        required: false

      # Artifacts exchanged between isolated workflow jobs.
      artifact_name:
        type: string
        description: "Name for uploaded artifact of image (this must be unique when building more than one multi architecture image)"
        default: "multi-arch-image"
        required: false

      artifact_directory:
        type: string
        description: "Directory to store built images, Snyk image cache, and build cache"
        default: "/tmp/images"
        required: false

      snyk_sarif_directory:
        type: string
        description: "Directory to store Snyk SARIF files"
        default: "test-results"
        required: false

      # Docker build inputs supplied by the consuming repository.
      build_options:
        type: string
        description: "A list of docker build options"
        required: false

      build_path:
        type: string
        description: "Build path for docker context"
        default: "."
        required: false

      cli_commands:
        type: string
        description: "Any cli commands that might need to be run before a build such as make targets"
        required: false

      # Check names shown in the consuming repository.
      job_name:
        type: string
        description: "Name of build image job for checking status against"
        default: "Docker Build, Scan and Push"
        required: false

      image_display_name:
        type: string
        description: "Optional image name to display in the job title, without the ECR registry"
        default: ""
        required: false

      build_target:
        type: string
        description: "Single build target for the Dockerfile"
        default: ""
        required: false

      # ECR BuildKit cache tag derived from the target image name.
      ecr_build_cache_tag_prefix:
        type: string
        description: "Tag prefix for the ECR BuildKit cache image"
        default: "build-cache"
        required: false

      # Multi-architecture build matrix. A single target skips consolidation.
      multi_arch_build_enabled:
        type: boolean
        description: "Build a multi-architecture image when more than one build target is provided"
        default: true
        required: false

      build_targets:
        type: string
        description: "JSON matrix of native build targets. Each entry requires actions_runner, platform, and tag"
        default: '[{"actions_runner":"ubuntu-latest","platform":"linux/amd64","tag":"AMD64"}]'
        required: false

      # AWS/OIDC settings for separate build and push roles.
      aws_region:
        type: string
        description: "AWS region"
        default: "eu-west-1"
        required: false

      aws_role_duration_seconds:
        type: number
        description: "AWS role duration seconds"
        default: 3600
        required: false

      oidc_role_session_name_build:
        type: string
        description: "OIDC role session name for pulling from ECR and building images"
        default: "OPGDockerBuildGithubAction"
        required: false

      oidc_role_session_name_push:
        type: string
        description: "OIDC role session name for pushing images and publishing ECR cache"
        default: "OPGDockerPushGithubAction"
        required: false

      oidc_role_to_assume_build:
        type: string
        description: "OIDC role used to pull from ECR and read ECR cache during native builds"
        default: ""
        required: false

      oidc_role_to_assume_push:
        type: string
        description: "OIDC role used to push images and publish ECR cache"
        default: ""
        required: false

      push_images:
        type: boolean
        description: "Push built images to ECR"
        default: true
        required: false

      # Runner used for the multi-architecture consolidation job.
      multi_arch_actions_runner:
        type: string
        description: "GitHub Actions runner for multi-architecture image consolidation"
        default: "ubuntu-latest"
        required: false

      # Snyk scanner image, policy, and container test options.
      enable_snyk_scanning:
        type: boolean
        description: "Enable Snyk container scanning"
        default: false
        required: false

      snyk_ecr_registry_id:
        type: string
        description: "AWS account ID for the ECR registry containing the Snyk image"
        default: "311462405659"
        required: false

      snyk_image:
        type: string
        description: "Snyk image reference"
        default: "shared/snyk:main-cli-1.1303.2-v0.3.0"
        required: false

      snyk_policy_path:
        type: string
        description: "Path to the Snyk policy file holding ignores/patches for the calling repository"
        default: "./.snyk"
        required: false

      snyk_container_options:
        type: string
        description: "Additional options to pass to snyk container test (e.g., --severity-threshold=high)"
        default: ""
        required: false

    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  # Build each platform natively so the scan runs before any image is pushed.
  build_single_images:
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.build_targets) }}
    name: "${{ inputs.job_name }} / Build Single Image / ${{ inputs.image_display_name || inputs.image_name }}"
    runs-on: ${{ matrix.actions_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Configure AWS Credentials (Build Role)
        if: ${{ inputs.oidc_role_to_assume_build != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-duration-seconds: ${{ inputs.aws_role_duration_seconds }}
          role-session-name: ${{ inputs.oidc_role_session_name_build }}
          role-to-assume: ${{ inputs.oidc_role_to_assume_build }}

      - name: Login to ECR (Build Role)
        if: ${{ inputs.oidc_role_to_assume_build != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Restore Snyk Image Cache
        if: ${{ inputs.enable_snyk_scanning }}
        id: snyk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ inputs.artifact_directory }}/snyk-cache
          key: snyk_cache_${{ inputs.snyk_image }}

      - name: Login to Snyk ECR (Build Role)
        if: ${{ inputs.enable_snyk_scanning && steps.snyk_cache.outputs.cache-hit != 'true' && inputs.snyk_ecr_registry_id != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ inputs.snyk_ecr_registry_id }}

      - name: Pull and Save Snyk Image
        if: ${{ inputs.enable_snyk_scanning && steps.snyk_cache.outputs.cache-hit != 'true' }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          SNYK_ECR_REGISTRY_ID: ${{ inputs.snyk_ecr_registry_id }}
          SNYK_IMAGE: ${{ inputs.snyk_image }}
          SNYK_CACHE_DIRECTORY: ${{ inputs.artifact_directory }}/snyk-cache
          SNYK_CACHE_PATH: ${{ inputs.artifact_directory }}/snyk-cache/snyk.tar
        run: |
          mkdir -p "${SNYK_CACHE_DIRECTORY}"
          SNYK_REGISTRY="${SNYK_ECR_REGISTRY_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker pull "${SNYK_REGISTRY}/${SNYK_IMAGE}"
          docker save "${SNYK_REGISTRY}/${SNYK_IMAGE}" --output "${SNYK_CACHE_PATH}"

      - name: Load Snyk Image
        if: ${{ inputs.enable_snyk_scanning }}
        env:
          SNYK_CACHE_PATH: ${{ inputs.artifact_directory }}/snyk-cache/snyk.tar
        run: docker load --input "${SNYK_CACHE_PATH}"

      - name: Build Single Image & Save Cache
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_OPTIONS: ${{ inputs.build_options }}
          BUILD_PATH: ${{ inputs.build_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          CACHE_DIRECTORY: ${{ inputs.artifact_directory }}/cache/${{ inputs.artifact_name }}-${{ matrix.tag }}
          ECR_BUILDKIT_CACHE_REF: ${{ inputs.image_name }}:${{ inputs.ecr_build_cache_tag_prefix }}-${{ inputs.image_tag }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ matrix.tag }}
        run: |
          mkdir -p "${CACHE_DIRECTORY}"
          ${{ inputs.cli_commands }}

          BUILD_TARGET_OPTION=""
          if [ -n "${BUILD_TARGET}" ]; then
            BUILD_TARGET_OPTION="--target ${BUILD_TARGET}"
          fi

          echo "Building ${IMAGE_REF} for ${{ matrix.platform }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE_REF}" \
            --load \
            --cache-from type=registry,ref="${ECR_BUILDKIT_CACHE_REF}" \
            --cache-to type=local,dest="${CACHE_DIRECTORY}",mode=max \
            ${BUILD_TARGET_OPTION} \
            ${BUILD_OPTIONS} \
            "${BUILD_PATH}"

      - name: Resolve Snyk policy file
        if: ${{ inputs.enable_snyk_scanning }}
        id: snyk_policy
        env:
          SNYK_POLICY_PATH: ${{ inputs.snyk_policy_path }}
          SNYK_SARIF_DIRECTORY: ${{ inputs.snyk_sarif_directory }}
        run: |
          if [ -f "${SNYK_POLICY_PATH}" ]; then
            echo "Using Snyk policy file ${SNYK_POLICY_PATH}"
            cat "${SNYK_POLICY_PATH}"
            POLICY_FILE="$(realpath "${SNYK_POLICY_PATH}")"
          else
            GENERATED_POLICY_PATH="${SNYK_SARIF_DIRECTORY}/.snyk-${{ matrix.tag }}"
            mkdir -p "${SNYK_SARIF_DIRECTORY}"
            printf 'version: v1.25.0\nignore: {}\npatch: {}\n' > "${GENERATED_POLICY_PATH}"
            echo "::warning::No Snyk policy file found at ${SNYK_POLICY_PATH}; using empty policy file ${GENERATED_POLICY_PATH}"
            POLICY_FILE="$(realpath "${GENERATED_POLICY_PATH}")"
          fi

          echo "path=${POLICY_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Snyk container test arguments
        if: ${{ inputs.enable_snyk_scanning }}
        id: snyk_args
        env:
          SNYK_CONTAINER_OPTIONS: ${{ inputs.snyk_container_options }}
          SNYK_CONTAINER_DOCKERFILE_PATH: ${{ inputs.snyk_sarif_directory }}/Dockerfile-${{ matrix.tag }}
        run: |
          mkdir -p "${{ inputs.snyk_sarif_directory }}"
          SNYK_TEST_ARGS="${SNYK_CONTAINER_OPTIONS}"

          if [[ " ${SNYK_TEST_ARGS} " =~ [[:space:]]--file=([^[:space:]]+) ]]; then
            SOURCE_DOCKERFILE="${BASH_REMATCH[1]}"
            if [ ! -f "${SOURCE_DOCKERFILE}" ]; then
              echo "::error::Snyk Dockerfile path does not exist: ${SOURCE_DOCKERFILE}"
              exit 1
            fi
            cp "${SOURCE_DOCKERFILE}" "${SNYK_CONTAINER_DOCKERFILE_PATH}"
            SNYK_TEST_ARGS="${SNYK_TEST_ARGS/--file=${SOURCE_DOCKERFILE}/--file=\/${SNYK_CONTAINER_DOCKERFILE_PATH}}"
          fi

          {
            echo "args<<EOF"
            echo "${SNYK_TEST_ARGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Scan image with Snyk
        if: ${{ inputs.enable_snyk_scanning }}
        id: snyk_scan
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@722a5f955424aaba01e9ca43d68390cd4048d6e1 # v4.10.2
        with:
          SNYK_TEST_IMAGE: ${{ inputs.image_name }}:${{ matrix.tag }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          snyk_policy_path: ${{ steps.snyk_policy.outputs.path }}
          snyk_test_args: ${{ steps.snyk_args.outputs.args }}
          sarif_filepath: ${{ inputs.snyk_sarif_directory }}
          sarif_filename: snyk-${{ matrix.tag }}.sarif

      # SARIF run count check and split is required because GitHub's upload-sarif action rejects files with more than 20 runs.
      - name: Count Snyk SARIF runs
        id: sarif_check
        if: ${{ inputs.enable_snyk_scanning && steps.snyk_scan.outcome == 'success' && hashFiles(format('{0}/snyk-{1}.sarif', inputs.snyk_sarif_directory, matrix.tag)) != '' }}
        env:
          SNYK_SARIF_DIRECTORY: ${{ inputs.snyk_sarif_directory }}
        run: |
          FILE="${SNYK_SARIF_DIRECTORY}/snyk-${{ matrix.tag }}.sarif"
          RUNS=$(jq '.runs | length' "${FILE}")
          echo "SARIF file has ${RUNS} runs"
          # GitHub's upload-sarif action rejects files with more than 20 runs
          if [ "${RUNS}" -gt 20 ]; then
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

      # split SARIF files when the upload limit is exceeded, and upload each part separately
      - name: Split Snyk SARIF when upload limit is exceeded
        if: ${{ steps.sarif_check.outputs.split == 'true' }}
        env:
          SNYK_SARIF_DIRECTORY: ${{ inputs.snyk_sarif_directory }}
        run: |
          FILE="${SNYK_SARIF_DIRECTORY}/snyk-${{ matrix.tag }}.sarif"
          BASE="${SNYK_SARIF_DIRECTORY}/snyk-${{ matrix.tag }}"
          jq '.runs = .runs[0:20]' "${FILE}" > "${BASE}_part_01.sarif"
          jq '.runs = .runs[20:]' "${FILE}" > "${BASE}_part_02.sarif"

      - name: Upload Snyk SARIF
        if: ${{ steps.sarif_check.outputs.split == 'false' }}
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          category: "snyk-${{ matrix.tag }}"
          sarif_file: "${{ inputs.snyk_sarif_directory }}/snyk-${{ matrix.tag }}.sarif"

      - name: Upload Snyk SARIF part 1
        if: ${{ steps.sarif_check.outputs.split == 'true' }}
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          category: "snyk-${{ matrix.tag }}-1"
          sarif_file: "${{ inputs.snyk_sarif_directory }}/snyk-${{ matrix.tag }}_part_01.sarif"

      - name: Upload Snyk SARIF part 2
        if: ${{ steps.sarif_check.outputs.split == 'true' && hashFiles(format('{0}/snyk-{1}_part_02.sarif', inputs.snyk_sarif_directory, matrix.tag)) != '' }}
        uses: github/codeql-action/upload-sarif@ce64ddcb0d8d890d2df4a9d1c04ff297367dea2a # v3.35.2
        with:
          category: "snyk-${{ matrix.tag }}-2"
          sarif_file: "${{ inputs.snyk_sarif_directory }}/snyk-${{ matrix.tag }}_part_02.sarif"

      - name: Configure AWS Credentials (Push Role)
        if: ${{ inputs.oidc_role_to_assume_push != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-duration-seconds: ${{ inputs.aws_role_duration_seconds }}
          role-session-name: ${{ inputs.oidc_role_session_name_push }}
          role-to-assume: ${{ inputs.oidc_role_to_assume_push }}
      - name: Login to ECR (Push Role)
        if: ${{ inputs.oidc_role_to_assume_push != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push Image
        if: ${{ inputs.push_images && inputs.oidc_role_to_assume_push != '' }}
        env:
          IMAGE_REF: ${{ inputs.image_name }}:${{ matrix.tag }}
        run: docker push "${IMAGE_REF}"

      - name: Archive Cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ inputs.artifact_name }}-${{ matrix.tag }}
          path: ${{ inputs.artifact_directory }}/cache/${{ inputs.artifact_name }}-${{ matrix.tag }}

  # Rebuild from single build cache artifacts to create one multi-architecture image.
  build_multi_arch_image:
    name: "${{ inputs.job_name }} / Build Multi Architecture Image"
    runs-on: ${{ inputs.multi_arch_actions_runner }}
    needs: [build_single_images]
    if: ${{ inputs.multi_arch_build_enabled && fromJSON(inputs.build_targets)[1] != null }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker
        run: |
          echo '{"experimental": true, "features": { "containerd-snapshotter": true }}' | sudo tee -a /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Download Cache
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ inputs.artifact_directory }}/cache
          pattern: cache-${{ inputs.artifact_name }}-*
          merge-multiple: false

      - name: Configure AWS Credentials (Push Role)
        if: ${{ inputs.oidc_role_to_assume_push != '' }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-duration-seconds: ${{ inputs.aws_role_duration_seconds }}
          role-session-name: ${{ inputs.oidc_role_session_name_push }}
          role-to-assume: ${{ inputs.oidc_role_to_assume_push }}

      - name: Login to ECR (Push Role)
        if: ${{ inputs.oidc_role_to_assume_push != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build Multi Architecture Image & Save Image
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact_directory }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_OPTIONS: ${{ inputs.build_options }}
          BUILD_PATH: ${{ inputs.build_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          ECR_BUILDKIT_CACHE_REF: ${{ inputs.image_name }}:${{ inputs.ecr_build_cache_tag_prefix }}-${{ inputs.image_tag }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          ${{ inputs.cli_commands }}
          PLATFORMS="$(jq -r '[.[].platform] | join(",")' <<< "${BUILD_TARGETS}")"
          CACHE_OPTIONS=""
          while read -r TARGET_TAG; do
            CACHE_OPTIONS="${CACHE_OPTIONS} --cache-from type=local,src=${ARTIFACT_DIRECTORY}/cache/cache-${ARTIFACT_NAME}-${TARGET_TAG}"
          done < <(jq -r '.[].tag' <<< "${BUILD_TARGETS}")
          BUILD_TARGET_OPTION=""
          if [ -n "${BUILD_TARGET}" ]; then
            BUILD_TARGET_OPTION="--target ${BUILD_TARGET}"
          fi

          echo "Consolidating ${IMAGE_REF} for ${PLATFORMS}"
          docker buildx build \
            --platform "${PLATFORMS}" \
            --tag "${IMAGE_REF}" \
            --load \
            ${CACHE_OPTIONS} \
            --cache-to type=registry,ref="${ECR_BUILDKIT_CACHE_REF}",mode=max,oci-mediatypes=true,image-manifest=true \
            ${BUILD_TARGET_OPTION} \
            ${BUILD_OPTIONS} \
            "${BUILD_PATH}"
          docker save -o "${ARTIFACT_DIRECTORY}/${ARTIFACT_NAME}.tar" "${IMAGE_REF}"

      - name: Push Image
        if: ${{ inputs.push_images && inputs.oidc_role_to_assume_push != '' }}
        env:
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: docker push "${IMAGE_REF}"

      - name: Archive image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ inputs.artifact_directory }}/${{ inputs.artifact_name }}.tar
