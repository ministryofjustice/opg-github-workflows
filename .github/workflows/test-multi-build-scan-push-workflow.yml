name: "[Build - Docker] Build Multi Architecture Image"

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        description: "Name of built image"
        required: true
      image_tag:
        type: string
        description: "Tag of built image"
        default: "latest"
        required: false
      artifact_name:
        type: string
        description: "Name for uploaded artifact of image (this must be unique in the case of building more than one multi arch image)"
        default: "multi-arch-image"
        required: false
      build_targets:
        type: string
        description: "JSON matrix of build targets. Each target must include actions_runner, platform, and tag."
        default: '[{"actions_runner":"ubuntu-latest","platform":"linux/amd64","tag":"AMD64"},{"actions_runner":"ubuntu-24.04-arm","platform":"linux/arm64/v8","tag":"ARM64"}]'
        required: false
      build_target:
        type: string
        description: "Dockerfile target stage to build"
        default: ""
        required: false
      enable_registry_cache:
        type: boolean
        description: "Enable remote registry cache read/write during architecture builds"
        default: true
        required: false
      artifact_directory:
        type: string
        description: "Directory to store built images and build cache"
        default: "/tmp/images"
        required: false
      build_options:
        type: string
        description: "A list of docker build options"
        required: false
      build_path:
        type: string
        description: "Build path for docker context"
        default: "."
        required: false
      cli_commands:
        type: string
        description: "Any cli commands that might need to be run before a build such as make targets"
        required: false
      aws_region:
        type: string
        description: "AWS region to use for ECR credentials"
        default: "eu-west-1"
        required: false
      oidc_role_to_assume_build:
        type: string
        description: "OIDC role to assume when pulling ECR cache and building images"
        default: ""
        required: false
      oidc_role_to_assume_push:
        type: string
        description: "OIDC role to assume when pushing images and ECR cache"
        default: ""
        required: false
      enable_snyk_scanning:
        type: boolean
        description: "Run Snyk scans before building images"
        default: true
        required: false
      snyk_iac_scan:
        type: boolean
        description: "Run Snyk IaC scan before building images"
        default: true
        required: false
      snyk_container_options:
        type: string
        description: "Additional options to pass to snyk container test"
        default: ""
        required: false
      snyk_policy_path:
        type: string
        description: "Path to the image-specific Snyk policy"
        default: ""
        required: false
      snyk_ecr_registry_id:
        type: string
        description: "AWS account ID for the OPG-managed Snyk image ECR registry"
        default: ""
        required: false
      job_name:
        type: string
        description: "Name of build image job for checking status against"
        default: "Build Multi Architecture Image"
        required: false
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  build_single_images:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_targets) }}
    name: "${{ inputs.job_name }} ${{ matrix.tag }}"
    runs-on: ${{ matrix.actions_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Configure AWS credentials for build
        if: ${{ inputs.enable_registry_cache || inputs.enable_snyk_scanning }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: 'true'
          role-duration-seconds: 3600
          role-session-name: OPGDockerBuildGithubAction
          role-to-assume: ${{ inputs.oidc_role_to_assume_build }}

      - name: Log in to image ECR
        if: ${{ inputs.enable_registry_cache || inputs.enable_snyk_scanning }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          ECR_REGISTRY="${IMAGE_NAME%%/*}"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Restore Snyk image cache
        if: ${{ inputs.enable_snyk_scanning }}
        id: snyk_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ inputs.artifact_directory }}/snyk-cache
          key: snyk_cache_${{ runner.os }}_opg_snyk
          restore-keys: |
            snyk_cache_${{ runner.os }}_
            snyk_cache_

      - name: Pull Snyk image
        if: ${{ inputs.enable_snyk_scanning && steps.snyk_cache.outputs.cache-hit != 'true' }}
        env:
          SNYK_CACHE_DIRECTORY: ${{ inputs.artifact_directory }}/snyk-cache
          SNYK_ECR_REGISTRY_ID: ${{ inputs.snyk_ecr_registry_id }}
          SNYK_IMAGE: ${{ inputs.snyk_ecr_registry_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/shared/snyk:cli-1.1303.2-v0.3.0
        run: |
          echo "::add-mask::${SNYK_ECR_REGISTRY_ID}"
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin "${SNYK_ECR_REGISTRY_ID}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
          docker pull "${SNYK_IMAGE}"
          mkdir -p "${SNYK_CACHE_DIRECTORY}"
          docker save "${SNYK_IMAGE}" --output "${SNYK_CACHE_DIRECTORY}/snyk-image.tar"

      - name: Load Snyk image
        if: ${{ inputs.enable_snyk_scanning }}
        run: docker load --input ${{ inputs.artifact_directory }}/snyk-cache/snyk-image.tar

      - name: Scan Terraform IaC with Snyk
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_iac_scan && matrix.tag == fromJSON(inputs.build_targets)[0].tag }}
        uses: ministryofjustice/opg-github-actions/actions/snyk-iac@ba13822b29c93ec21d9d19e7ca2a8b17f6fe4beb
        with:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          sarif_filename: snyk-iac.sarif

      - name: Upload Snyk IaC results to GitHub Security
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_iac_scan && matrix.tag == fromJSON(inputs.build_targets)[0].tag && always() && hashFiles('test-results/snyk-iac.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: IaC
          sarif_file: test-results/snyk-iac.sarif

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Run Docker build
        env:
          BUILD_OPTIONS: ${{ inputs.build_options }}
          BUILD_PATH: ${{ inputs.build_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          CACHE_REF: ${{ inputs.image_name }}:build-cache-${{ matrix.tag }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.tag }}
        run: |
          ${{ inputs.cli_commands }}
          echo "Building ${{ inputs.image_name }} for ${{ matrix.platform }} as ${{ matrix.tag }}"
          BUILD_TARGET_OPTION=""
          if [ -n "${BUILD_TARGET}" ]; then
            BUILD_TARGET_OPTION="--target ${BUILD_TARGET}"
          fi
          CACHE_OPTIONS=""
          if [ "${{ inputs.enable_registry_cache }}" = "true" ]; then
            CACHE_OPTIONS="--cache-from type=registry,ref=${CACHE_REF} --cache-to type=registry,ref=${CACHE_REF},mode=max"
          fi
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --tag "${IMAGE_REF}" \
            ${CACHE_OPTIONS} \
            --load \
            ${BUILD_TARGET_OPTION} \
            ${BUILD_OPTIONS} \
            "${BUILD_PATH}"

      - name: Scan image with Snyk
        if: ${{ inputs.enable_snyk_scanning }}
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@ba13822b29c93ec21d9d19e7ca2a8b17f6fe4beb
        with:
          SNYK_TEST_IMAGE: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.tag }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          snyk_policy_path: ${{ inputs.snyk_policy_path }}
          sarif_filename: snyk-${{ matrix.tag }}.sarif
          snyk_test_args: ${{ inputs.snyk_container_options }}

      - name: Upload container scan results to GitHub Security
        if: ${{ inputs.enable_snyk_scanning && always() && hashFiles('test-results/snyk-*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: Docker ${{ matrix.tag }}
          sarif_file: test-results/snyk-${{ matrix.tag }}.sarif
      - name: Configure AWS credentials for push
        if: ${{ inputs.enable_registry_cache }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: 'true'
          role-duration-seconds: 3600
          role-session-name: OPGDockerPushGithubAction
          role-to-assume: ${{ inputs.oidc_role_to_assume_push }}

      - name: Login To Image ECR For Push
        if: ${{ inputs.enable_registry_cache }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          ECR_REGISTRY="${IMAGE_NAME%%/*}"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Push image
        if: ${{ inputs.enable_registry_cache }}
        env:
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.tag }}
        run: docker push "${IMAGE_REF}"
      - name: Determine Archive Name
        id: archive
        if: ${{ inputs.artifact_name != '' }}
        env:
          ARCHIVE_BASE: ${{ inputs.artifact_name }}
          IS_MULTI_ARCH: ${{ fromJSON(inputs.build_targets)[1] != null }}
        run: |
          if [ "${IS_MULTI_ARCH}" = "true" ]; then
            echo "name=${ARCHIVE_BASE}-${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${ARCHIVE_BASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive image
        if: ${{ inputs.artifact_name != '' }}
        env:
          ARCHIVE_PATH: ${{ inputs.artifact_directory }}/${{ steps.archive.outputs.name }}.tar
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.tag }}
        run: |
          mkdir -p "$(dirname "${ARCHIVE_PATH}")"
          docker save "${IMAGE_REF}" --output "${ARCHIVE_PATH}"

      - name: Upload image archive
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ inputs.artifact_directory }}/${{ steps.archive.outputs.name }}.tar
      - name: Publish Single-Architecture Image Tag
        if: ${{ inputs.enable_registry_cache && fromJSON(inputs.build_targets)[1] == null }}
        env:
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}-${{ matrix.tag }}
          FINAL_IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          docker tag "${IMAGE_REF}" "${FINAL_IMAGE_REF}"
          docker push "${FINAL_IMAGE_REF}"

  build_multi_arch_image:
    if: ${{ inputs.enable_registry_cache && fromJSON(inputs.build_targets)[1] != null }}
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    needs: [build_single_images]
    steps:
      - name: Configure AWS Credentials For Push
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: 'true'
          role-duration-seconds: 3600
          role-session-name: OPGDockerPublishGithubAction
          role-to-assume: ${{ inputs.oidc_role_to_assume_push }}
      - name: Login To ECR
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          ECR_REGISTRY="${IMAGE_NAME%%/*}"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region ${{ inputs.aws_region }} | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Publish Image Tag
        env:
          BUILD_TARGETS: ${{ inputs.build_targets }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          mapfile -t ARCH_IMAGE_REFS < <(jq -r --arg image "${IMAGE_NAME}" --arg image_tag "${IMAGE_TAG}" '.[] | "\($image):\($image_tag)-\(.tag)"' <<< "${BUILD_TARGETS}")
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${ARCH_IMAGE_REFS[@]}"

      - name: Push ECR Cache
        if: ${{ inputs.enable_registry_cache == true }}
        env:
          BUILD_TARGETS: ${{ inputs.build_targets }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          mapfile -t CACHE_REFS < <(jq -r --arg image "${IMAGE_NAME}" '.[] | "\($image):build-cache-\(.tag)"' <<< "${BUILD_TARGETS}")
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:build-cache" \
            "${CACHE_REFS[@]}"
