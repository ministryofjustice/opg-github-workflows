name: "[Build - Docker] Build Multi Architecture Image"

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        description: "Name of built image"
        required: true
      image_tag:
        type: string
        description: "Tag of built image"
        default: "latest"
        required: false
      artifact_name:
        type: string
        description: "Name for uploaded artifact of image (this must be unique in the case of building more than one multi arch image)"
        default: "multi-arch-image"
        required: false
      artifact_directory:
        type: string
        description: "Directory to store built images and build cache"
        default: "/tmp/images"
        required: false
      build_targets:
        type: string
        description: "JSON matrix of build targets. Each entry must include actions_runner, platform and tag."
        default: '[{"actions_runner":"ubuntu-latest","platform":"linux/amd64","tag":"AMD64"},{"actions_runner":"ubuntu-24.04-arm","platform":"linux/arm64/v8","tag":"ARM64"}]'
        required: false
      build_target:
        type: string
        description: "Dockerfile target stage to build"
        default: ""
        required: false
      build_options:
        type: string
        description: "A list of docker build options"
        required: false
      build_path:
        type: string
        description: "Build path for docker context"
        default: "."
        required: false
      cli_commands:
        type: string
        description: "Any cli commands that might need to be run before a build such as make targets"
        required: false
      job_name:
        type: string
        description: "Name of build image job for checking status against"
        default: "Build Multi Architecture Image"
        required: false
      aws_region:
        type: string
        description: "AWS region used when pulling the OPG Snyk image"
        default: "eu-west-1"
        required: false
      oidc_role_to_assume:
        type: string
        description: "OIDC role assumed only to pull the OPG-managed Snyk image from ECR"
        default: ""
        required: false
      oidc_role_to_assume_push:
        type: string
        description: "OIDC role assumed to push the consolidated image to ECR"
        default: ""
        required: false
      enable_snyk_scanning:
        type: boolean
        description: "Run a Snyk container scan on each architecture build"
        default: false
        required: false
      snyk_iac_scan:
        type: boolean
        description: "Run a Snyk IaC scan once, on the first build target"
        default: false
        required: false
      snyk_container_options:
        type: string
        description: "Additional options to pass to snyk container test"
        default: ""
        required: false
      snyk_policy_path:
        type: string
        description: "Path to the image-specific Snyk policy"
        default: ""
        required: false
      snyk_ecr_registry_id:
        type: string
        description: "AWS account ID for the OPG-managed Snyk image ECR registry"
        default: ""
        required: false
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  build_single_images:
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.build_targets) }}
    name: "${{ inputs.job_name }} ${{ matrix.tag }}"
    runs-on: ${{ matrix.actions_runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS Credentials For Snyk Image Pull
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_ecr_registry_id != '' }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-duration-seconds: 3600
          role-session-name: OPGDockerBuildGithubAction
          role-to-assume: ${{ inputs.oidc_role_to_assume }}

      # Cache key includes runner.arch: an amd64 snyk tar will not run on an arm64 runner.
      - name: Restore Snyk Image Cache
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_ecr_registry_id != '' }}
        id: snyk_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ inputs.artifact_directory }}/snyk-cache
          key: snyk_cache_${{ runner.os }}_${{ runner.arch }}_opg_snyk
          restore-keys: |
            snyk_cache_${{ runner.os }}_${{ runner.arch }}_

      - name: Pull Snyk Image
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_ecr_registry_id != '' && steps.snyk_cache.outputs.cache-hit != 'true' }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          SNYK_CACHE_DIRECTORY: ${{ inputs.artifact_directory }}/snyk-cache
          SNYK_ECR_REGISTRY_ID: ${{ inputs.snyk_ecr_registry_id }}
        run: |
          echo "::add-mask::${SNYK_ECR_REGISTRY_ID}"
          SNYK_REGISTRY="${SNYK_ECR_REGISTRY_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SNYK_IMAGE="${SNYK_REGISTRY}/shared/snyk:cli-1.1303.2-v0.3.0"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${SNYK_REGISTRY}"
          docker pull "${SNYK_IMAGE}"
          mkdir -p "${SNYK_CACHE_DIRECTORY}"
          docker save "${SNYK_IMAGE}" --output "${SNYK_CACHE_DIRECTORY}/snyk-image.tar"

      - name: Load Snyk Image
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_ecr_registry_id != '' }}
        run: docker load --input "${{ inputs.artifact_directory }}/snyk-cache/snyk-image.tar"

      - name: Scan Terraform IaC With Snyk
        if: ${{ inputs.enable_snyk_scanning && inputs.snyk_iac_scan && matrix.tag == fromJSON(inputs.build_targets)[0].tag }}
        uses: ministryofjustice/opg-github-actions/actions/snyk-iac@ba13822b29c93ec21d9d19e7ca2a8b17f6fe4beb
        with:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          sarif_filename: snyk-iac.sarif

      - name: Upload Snyk IaC Results
        if: ${{ always() && inputs.enable_snyk_scanning && inputs.snyk_iac_scan && matrix.tag == fromJSON(inputs.build_targets)[0].tag && hashFiles('test-results/snyk-iac.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: IaC
          sarif_file: test-results/snyk-iac.sarif

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      # Same shape as main: build natively, export a local cache, no registry writes.
      # --load is only added when the image is needed in the local daemon (scan or single-arch artifact).
      - name: Build Image & Save Cache
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_OPTIONS: ${{ inputs.build_options }}
          BUILD_PATH: ${{ inputs.build_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          CACHE_DIRECTORY: ${{ inputs.artifact_directory }}/cache/${{ inputs.artifact_name }}-${{ matrix.tag }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ matrix.tag }}
          IS_MULTI_ARCH: ${{ fromJSON(inputs.build_targets)[1] != null }}
          PLATFORM: ${{ matrix.platform }}
          SNYK_ENABLED: ${{ inputs.enable_snyk_scanning }}
        run: |
          mkdir -p "${CACHE_DIRECTORY}"
          ${{ inputs.cli_commands }}

          BUILD_TARGET_OPTION=""
          if [ -n "${BUILD_TARGET}" ]; then
            BUILD_TARGET_OPTION="--target ${BUILD_TARGET}"
          fi
          LOAD_OPTION=""
          if [ "${SNYK_ENABLED}" = "true" ] || [ "${IS_MULTI_ARCH}" != "true" ]; then
            LOAD_OPTION="--load"
          fi
          echo "Building ${IMAGE_REF} for ${PLATFORM}"
          docker buildx build \
            --platform "${PLATFORM}" \
            --tag "${IMAGE_REF}" \
            --cache-to type=local,dest="${CACHE_DIRECTORY}",mode=max \
            ${LOAD_OPTION} \
            ${BUILD_TARGET_OPTION} \
            ${BUILD_OPTIONS} \
            "${BUILD_PATH}"

      # snyk-scan bind-mounts the policy file, so a relative path is read as a docker volume name and rejected.
      # Normalise it here so callers can keep passing repo-relative paths.
      - name: Resolve Snyk Policy Path
        id: snyk_policy
        if: ${{ inputs.enable_snyk_scanning }}
        env:
          SNYK_POLICY_PATH: ${{ inputs.snyk_policy_path }}
        run: |
          RESOLVED="${SNYK_POLICY_PATH}"
          if [ -n "${RESOLVED}" ] && [ "${RESOLVED#/}" = "${RESOLVED}" ]; then
            RESOLVED="${GITHUB_WORKSPACE}/${RESOLVED}"
          fi
          echo "path=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - name: Scan Image With Snyk
        if: ${{ inputs.enable_snyk_scanning }}
        uses: ministryofjustice/opg-github-actions/actions/snyk-scan@ba13822b29c93ec21d9d19e7ca2a8b17f6fe4beb
        with:
          SNYK_TEST_IMAGE: ${{ inputs.image_name }}:${{ matrix.tag }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          snyk_policy_path: ${{ steps.snyk_policy.outputs.path }}
          sarif_filename: snyk-${{ matrix.tag }}.sarif
          snyk_test_args: ${{ inputs.snyk_container_options }}

      - name: Upload Container Scan Results
        if: ${{ always() && inputs.enable_snyk_scanning && hashFiles(format('test-results/snyk-{0}.sarif', matrix.tag)) != '' }}
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          category: Docker ${{ matrix.tag }}
          sarif_file: test-results/snyk-${{ matrix.tag }}.sarif

      - name: Archive Cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ inputs.artifact_name }}-${{ matrix.tag }}
          path: ${{ inputs.artifact_directory }}/cache/${{ inputs.artifact_name }}-${{ matrix.tag }}

      # Single-architecture callers get the same artifact name the consolidation job would have produced.
      - name: Save Single Architecture Image
        if: ${{ fromJSON(inputs.build_targets)[1] == null }}
        env:
          ARCHIVE_PATH: ${{ inputs.artifact_directory }}/${{ inputs.artifact_name }}.tar
          IMAGE_REF: ${{ inputs.image_name }}:${{ matrix.tag }}
          FINAL_IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          docker tag "${IMAGE_REF}" "${FINAL_IMAGE_REF}"
          mkdir -p "$(dirname "${ARCHIVE_PATH}")"
          docker save -o "${ARCHIVE_PATH}" "${FINAL_IMAGE_REF}"

      - name: Archive Single Architecture Image
        if: ${{ fromJSON(inputs.build_targets)[1] == null }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_directory }}/${{ inputs.artifact_name }}.tar

  build_multi_arch_image:
    if: ${{ fromJSON(inputs.build_targets)[1] != null }}
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    needs: [build_single_images]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker
        run: |
          echo '{"experimental": true, "features": { "containerd-snapshotter": true }}' | sudo tee -a /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --privileged --rm tonistiigi/binfmt --install all

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ inputs.artifact_directory }}/cache
          pattern: cache-${{ inputs.artifact_name }}-*
          merge-multiple: false

      - name: Build & Save Image
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact_directory }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_OPTIONS: ${{ inputs.build_options }}
          BUILD_PATH: ${{ inputs.build_path }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: |
          ${{ inputs.cli_commands }}
          PLATFORMS="$(jq -r '[.[].platform] | join(",")' <<< "${BUILD_TARGETS}")"
          CACHE_OPTIONS=""
          while read -r TARGET_TAG; do
            CACHE_OPTIONS="${CACHE_OPTIONS} --cache-from type=local,src=${ARTIFACT_DIRECTORY}/cache/cache-${ARTIFACT_NAME}-${TARGET_TAG}"
          done < <(jq -r '.[].tag' <<< "${BUILD_TARGETS}")
          BUILD_TARGET_OPTION=""
          if [ -n "${BUILD_TARGET}" ]; then
            BUILD_TARGET_OPTION="--target ${BUILD_TARGET}"
          fi
          echo "Consolidating ${IMAGE_REF} for ${PLATFORMS}"
          docker build \
            --platform "${PLATFORMS}" \
            --tag "${IMAGE_REF}" \
            ${CACHE_OPTIONS} \
            ${BUILD_TARGET_OPTION} \
            ${BUILD_OPTIONS} \
            "${BUILD_PATH}"
          docker save -o "${ARTIFACT_DIRECTORY}/${ARTIFACT_NAME}.tar" "${IMAGE_REF}"

      - name: Configure AWS Credentials For Image Push
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-duration-seconds: 3600
          role-session-name: OPGDockerPushGithubAction
          role-to-assume: ${{ inputs.oidc_role_to_assume_push }}

      - name: Login To Image ECR For Push
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          ECR_REGISTRY="${IMAGE_NAME%%/*}"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region "${{ inputs.aws_region }}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Push Consolidated Image
        env:
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.image_tag }}
        run: docker push "${IMAGE_REF}"

      - name: Archive image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ inputs.artifact_directory }}/${{ inputs.artifact_name }}.tar
