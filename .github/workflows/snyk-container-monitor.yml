name: "[Snyk] Container Monitor"

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      oidc_role_to_assume:
        type: string
        description: "OIDC role used to pull monitored images and the Snyk CLI image from ECR"
        required: true
      ecr_registry_id:
        type: string
        description: "AWS account ID for the ECR registry containing the monitored images"
        required: true
      aws_region:
        type: string
        description: "AWS region hosting ECR"
        default: "eu-west-1"
        required: false
      aws_role_duration_seconds:
        type: number
        description: "AWS role duration in seconds"
        default: 3600
        required: false
      oidc_role_session_name:
        type: string
        description: "OIDC role session name for monitoring ECR images"
        default: "OPGSnykContainerMonitorGithubAction"
        required: false
      snyk_ecr_registry_id:
        type: string
        description: "AWS account ID for the ECR registry containing the Snyk CLI image"
        required: true
      snyk_image:
        type: string
        description: "Snyk image reference in ECR"
        default: "shared/snyk:main-cli-1.1303.2-v0.3.0"
        required: false
      snyk_org:
        type: string
        description: "Optional Snyk organisation ID to send projects to"
        default: ""
        required: false
      deployment_environment:
        type: string
        description: "Deployment environment used in Snyk project and target references"
        required: true
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  # Monitor pushed images pulled from ECR through the Snyk container monitor job.
  snyk_container_monitor:
    name: "Snyk Container Monitor"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built image manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-manifest-${{ github.run_id }}-*
          path: ${{ runner.temp }}/snyk-monitor-artifacts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          mask-aws-account-id: "true"
          role-to-assume: ${{ inputs.oidc_role_to_assume }}
          role-duration-seconds: ${{ inputs.aws_role_duration_seconds }}
          role-session-name: ${{ inputs.oidc_role_session_name }}

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: "${{ inputs.ecr_registry_id }},${{ inputs.snyk_ecr_registry_id }}"

      - name: Snyk container monitor
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          ECR_REGISTRY_ID: ${{ inputs.ecr_registry_id }}
          SNYK_ECR_REGISTRY_ID: ${{ inputs.snyk_ecr_registry_id }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_IMAGE: ${{ inputs.snyk_image }}
          SNYK_ORG: ${{ inputs.snyk_org }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          REPOSITORY: ${{ github.repository }}
          MONITOR_ARTIFACTS_PATH: ${{ runner.temp }}/snyk-monitor-artifacts
        run: |
          ECR_REGISTRY="${ECR_REGISTRY_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SNYK_REGISTRY="${SNYK_ECR_REGISTRY_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          for manifest in "${MONITOR_ARTIFACTS_PATH}"/*/images.json; do
            if [ ! -f "${manifest}" ]; then
              echo "::error::No image manifest found. Upload image-manifest-${GITHUB_RUN_ID}-* artifacts from the calling workflow."
              exit 1
            fi

            images="$(jq -c '.[]' "${manifest}")"
            while IFS= read -r image; do
              IMAGE_NAME="$(jq -r '.name // empty' <<< "${image}")"
              IMAGE_TAG="$(jq -r '.tag // empty' <<< "${image}")"
              POLICY_PATH="$(jq -r '.policy // empty' <<< "${image}")"
              if [ -z "${IMAGE_NAME}" ] || [ -z "${IMAGE_TAG}" ]; then
                echo "::error::Each image must have a name and tag."
                exit 1
              fi

              image_ref="${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
              environment_tag="${DEPLOYMENT_ENVIRONMENT//[^a-zA-Z0-9_.-]/-}"
              snyk_ref="${REPOSITORY}:${IMAGE_NAME//\//-}-${environment_tag}-monitor"

              docker pull "${image_ref}"
              docker tag "${image_ref}" "${snyk_ref}"
              echo "Monitoring ${snyk_ref}"

              extra_args=()
              if [ -n "${SNYK_ORG}" ]; then
                extra_args+=("--org=${SNYK_ORG}")
              fi
              if [ -n "${POLICY_PATH}" ] && [ -f "${GITHUB_WORKSPACE}/${POLICY_PATH}" ]; then
                extra_args+=("--policy-path=/project/${POLICY_PATH}")
              elif [ -f "${GITHUB_WORKSPACE}/.github/.snyk" ]; then
                extra_args+=("--policy-path=/project/.github/.snyk")
              fi

              docker run --rm \
                --env SNYK_TOKEN \
                --volume /var/run/docker.sock:/var/run/docker.sock \
                --volume "${GITHUB_WORKSPACE}:/project:ro" \
                "${SNYK_REGISTRY}/${SNYK_IMAGE}" \
                container monitor "${snyk_ref}" \
                --project-name="${REPOSITORY}/${IMAGE_NAME//\//-}" \
                --target-reference="${DEPLOYMENT_ENVIRONMENT}" \
                --project-tags="repository=${REPOSITORY},service=${IMAGE_NAME//\//-}" \
                "${extra_args[@]}"
            done <<< "${images}"
          done
